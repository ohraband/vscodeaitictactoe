apiVersion: batch/v1
kind: Job
metadata:
  name: ttt-migrate
  labels:
    app.kubernetes.io/name: ttt
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ttt
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ttt:latest
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - '@ttt/server'
            - prisma:deploy
          envFrom:
            - configMapRef:
                name: ttt-config
            - secretRef:
                name: ttt-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
