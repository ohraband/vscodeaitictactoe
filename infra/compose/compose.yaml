services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ttt
      POSTGRES_PASSWORD: ttt
      POSTGRES_DB: ttt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ttt -d ttt']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ttt:compose
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://ttt:ttt@postgres:5432/ttt
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to at least 32 characters}
      TURN_SECONDS: 60
      RATE_LIMIT_ENABLED: 'true'
      CSP_UPGRADE_INSECURE_REQUESTS: ${CSP_UPGRADE_INSECURE_REQUESTS:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    command:
      ['sh', '-c', 'pnpm --filter @ttt/server prisma:deploy && node apps/server/dist/index.js']
    ports:
      - '${APP_HOST_PORT:-3000}:3000'

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: ['analytics']
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - '127.0.0.1:9092:9092'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    profiles: ['analytics']
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'rpk topic create ttt.game.completed --brokers redpanda:9092 || true'
    restart: 'no'

  analytics-worker:
    image: ttt:compose
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    profiles: ['analytics']
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ttt:ttt@postgres:5432/ttt
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to at least 32 characters}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      KAFKA_CLIENT_ID: ttt-server
      KAFKA_ANALYTICS_TOPIC: ttt.game.completed
      KAFKA_ANALYTICS_GROUP_ID: ttt-analytics
    command: ['node', 'apps/server/dist/analytics/worker.js']

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['observability']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      app:
        condition: service_started

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ['observability']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
