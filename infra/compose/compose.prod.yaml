services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports: !override
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      TTT_DOMAIN: ${TTT_DOMAIN:?set TTT_DOMAIN}
    volumes: !override
      - ../vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  app:
    environment:
      DATABASE_URL: postgresql://ttt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ttt
      CSP_UPGRADE_INSECURE_REQUESTS: ${CSP_UPGRADE_INSECURE_REQUESTS:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}

  analytics-worker:
    environment:
      DATABASE_URL: postgresql://ttt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ttt

  cursor-consumer:
    environment:
      DATABASE_URL: postgresql://ttt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ttt

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}

volumes:
  caddy-data:
  caddy-config:
